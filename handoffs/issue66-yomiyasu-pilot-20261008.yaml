      ## 意味保持の点検と評価の限界


      担当者の自己点検と補助点検では、変更前後の主体、目的、条件、義務・任意の強さ、時点・順序、比較対象、識別子を照合した。採用した3段落について、これらの情報の脱落や意味の変化は見つからなかった。


