design_contract:
  raw_vision_endpoint: 224.5.23.2:10020
  tracker_endpoint: 224.5.23.2:11010
  referee_endpoint: 224.5.23.1:11003
  sources:
    - Duck Tracker.RuntimeHost
    - TIGERs Sumatra world predictor / tracker
    - ER-Force AutoRef tracker source
  observer: Tracker.DebugHost
  live_alignment: same UI render tick with per-source timestamp and age metadata
  replay_alignment: same diagnostics sample tick; saved alignment first, latest-before fallback, never future snapshots
  robot_matching: team color plus robot id
  ball_matching: do not use tracker-specific track id; one-to-one position matching with configurable distance gate

