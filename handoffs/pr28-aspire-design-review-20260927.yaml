findings:
  - id: I28-DR-001
    severity: medium
    origin: introduced_by_change
    location: Tracker/Design/Testing/tracker-comparison-debug-design.md:85-87; Tracker/Design/DebugHost/raw-vision-viewer-plan.md:218; Tracker/Tracker.Tests/VisionLiveComparisonViewStateTests.cs:263
    description: new comparison design treats ambiguous/colliding identity as comparison-not-ready while existing DebugHost contract collapses identical UUID across endpoints to one representative source
    impact: ASPIRE-006B has two incompatible source-identity contracts
    evidence: existing design and regression test explicitly collapse same UUID; new design says collision must not be merged and must be not-ready
    required_action: choose one contract, update the authoritative design(s), and fix TDD expectations for collision Ready/source-option behavior
  - id: I28-DR-002
    severity: medium
    origin: introduced_by_change
    location: Tracker/Design/Testing/aspire-simulation-test-environment.md:65,234-241; RuntimeVisionReceiverService.cs:113-115; UdpTrackerReceiver.cs:40-46
    description: ASPIRE-NET-009 uses port-in-use preflight although required multicast ports intentionally support multiple receivers with SO_REUSEADDR
    impact: second-stack detection can false-positive or false-negative depending OS/socket probe semantics
    evidence: NET-003/005/006 require sharing 10020/11010; Duck receivers use ReuseAddress
    required_action: classify exclusive vs shareable ports and define an unambiguous second-stack ownership check
  - id: I28-DR-003
    severity: medium
    origin: coverage_miss
    location: Tracker/Design/Testing/aspire-simulation-test-environment.md:234-235,243,256; RuntimeVisionReceiverService.cs:41-58; RuntimeVisionPacketBuffer.cs:9-51
    description: NET-002/003 require RuntimeHost received-packet counts but RuntimeHost exposes no cumulative receive counter and its buffer only retains latest packets
    impact: acceptance evidence cannot prove the stated RuntimeHost count using the existing observable contract
    evidence: receiver only stores packets; buffer overwrites per camera and clears batches
    required_action: define a RuntimeHost receiver counter/log/test seam and evidence collection path; do not substitute an independent sniffer count

