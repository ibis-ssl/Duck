      | ローカル.NETテスト | 文書手順書の修正では実行していない。 |


      最初の修正文では、二重の逆引用符を使ったMarkdown記法例の `TrackerFrame` が検査に残り、全体検査が終了値123、手順書のcspellと許可一覧検査が終了値1になった。実際の識別子を通常の行内記法で示す説明に直して再検証した。失敗した記録は上書きせず
      `after-*`、修正後は `refined-*`、他の変更を取り込んだ後は `integrated-*` として保存した。


      文書変更のため検証中心で進めた。製品実装のTDDや独立レビューを実施したとは扱わない。変更前後の本文・定義・設定を読む自己点検と、機械的な検査結果は区別している。


