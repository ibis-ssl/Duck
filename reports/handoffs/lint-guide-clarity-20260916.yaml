      今回の作業では、全301項目・変更前の全出現箇所の意味対応を完了していない。この手順書の修正をWR-007全体の解消とは扱わない。引用文中の未登録語について追加承認は受けておらず、許可一覧や引用文を変更しなかった。共有検査器の短い「キャプチャ」の扱いは、前報告に残る問題であり、今回は再検証・改修していない。


