      ## 関連する元指摘（重要度と原文を保持）


      今回の修正は同種の表記問題への部分対応であり、元指摘全体を解消したという判定ではない。


      ### WR-007 [medium] 許可済み語を許可後も別の説明へ置き換えており、名称と本文が一致していない


      - 起点: `introduced_by_change`。箇所: `Tracker/Design/Core/tracker-architecture-plan.md:596,628-634,719,752,758,854; Tracker/Tracker.DebugHost/README.md:83;
      Tracker/Design/DebugHost/debug-host-maintainability-design.md:14`。

      - 内容: 代表例は Kalman filter → カルマン状態推定、process noise → プロセス側の揺らぎ、measurement noise → 観測側の揺らぎ、timeline scrubber → 再生位置操作部、render
      snapshot → 描画時点の記録。許可済みの名称を避ける必要はない。

      - 影響: 推定方式、設定項目、記録形式や画面部品の名前をコード・許可一覧と結び付けにくくする。状態推定のような広い言葉では、方式名という識別情報も弱くなる。

