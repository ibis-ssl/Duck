      開始時に確認した `origin/main` の `.github/workflows/dotnet-test.yml` は、失敗時にTRX、標準出力、標準エラー、VSTest診断、MSBuild binlog、終了値、環境情報、ソースを保存する。PRのHEADツリーには同ファイルがない。今回はworkflowを変更せず、この手順書変更に関する成功・失敗の診断記録をリポジトリへ保存する。現在のPR
      HEADと一致しないCI結果は使用しない。


