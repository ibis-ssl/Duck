      | 構築木 | ビルド用ディレクトリ。除外対象のパスは変えていない。 |

      | 囲み付き符号片、逆引用符で囲んだ行内の識別子 | 行内の識別子と複数行のソースコードの説明へ変更。通常の文章を囲んで検査を回避することは禁止したままにした。 |

      | 連結符付き表記 | `-` でつないだ表記。別表記の追加には既存どおり明示登録が必要である。 |


      文書差分は18行の置き換え。Bashの囲み内コマンドと見出しは変更前と一致する。YAML例の説明文にある「作業一式」も「リポジトリ」へ直したが、設定キーや許可登録の構造は変えていない。許可一覧、表記揺れ辞書、対象除外設定、package設定、製品ソースは変更していない。


