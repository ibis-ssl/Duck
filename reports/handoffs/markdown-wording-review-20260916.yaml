      title: profile switch / profile を設定組へ置き換えず、設定プロファイルで統一する
      description: 実際の HEAD の表記は主に「設定組」「設定組の切り替え」「設定組切り替え」であり、利用者が例示した「設定組入れ替え」という完全一致文字列ではない。profile switch と runtime profile
