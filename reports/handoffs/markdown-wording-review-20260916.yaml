findings:
- id: WR-001
  severity: medium
  origin: introduced_by_change
  location: Tracker/Design/Core/tracker-core-engine-detail-design.md:355
  title: source frame number を追跡結果の番号へ変えており、入力と出力を取り違えている
  description: 変更前の source frame number が「入力元の追跡結果の番号」へ変更された。ホワイトリストでは入力元の検出単位の番号と定義し、追跡器が出す番号とは区別している。
  impact: 入力の並べ替え条件を出力の追跡番号と誤読させ、保守時に別の番号を使う危険がある。
  evidence: tools/lint/markdown-whitelist.yaml:83-84。Tracker/Tracker.Core/Engine/TrackerEngine/DetectionBuffer.cs:11-19 は
    SSL_DetectionFrame.FrameNumber を SourceFrameNumber として保持し、FrameCommit.cs:21-27 は EventTimestampNs、CameraId、SourceFrameNumber
    の順で並べる。出力番号は FrameCommit.cs:183 の nextCommittedFrameNumber++。
  required_action: source frame number を維持し、必要なら「入力の観測フレーム番号」を説明として添える。入力番号と追跡番号を区別した本文へ修正し、同種の frame の訳を横断確認する。
- id: WR-002
  severity: medium
  origin: introduced_by_change
  location: Tracker/Design/Core/tracker-architecture-plan.md:268,347,474,487
  title: raw vision を未加工映像とすると、座標などの検出情報と画像・映像を混同させる
  description: 許可済みの raw vision が「未加工映像」「未加工映像パケット」へ変更された。追跡エンジンが受け取るのは SSL_WrapperPacket であり、本文が扱う検出情報を映像データそのもののように表している。
  impact: トラッカーがカメラ映像を直接処理する設計に読め、SSL-Vision と Tracker.Core の責務境界が不明確になる。
  evidence: Tracker/Tracker.Core/Engine/ITrackerEngine.cs:9-16 の Update は SSL_WrapperPacket を受け取る。DetectionBuffer.cs:11-19
    は SSL_DetectionFrame の Balls、RobotsYellow、RobotsBlue を取り込む。ホワイトリストには raw vision と raw vision viewer が登録されている。
  required_action: 許可済みの raw vision を残し、初出で「SSL-Vision の検出情報」と説明する。「未加工映像」は実際に画像や動画を意味する場合だけに使う。関連 README、設計、脚注も同じ意味へ揃える。
- id: WR-003
  severity: medium
  origin: introduced_by_change
  location: Tracker/Design/Core/tracker-history-000-038.md:15; Tracker/Design/Core/tracker-architecture-plan.md:1130,1154
  title: observer-event の通知先とイベントデータの区別が訳から落ちている
  description: 履歴では「通知イベント契約」、設計のタスク説明では「通知を受け取る処理契約」へ変わっている。前者はイベント中心、後者は通知先中心であり、同じ observer/event 契約を一貫して表していない。単に完全な誤訳とは断定しないが、両方を表すには不足する。
  impact: ITrackerObserver の受信側契約と TrackerEvent の通知データ契約のどちらを実装・維持すべきか曖昧になる。
  evidence: ITrackerObserver.cs:6-36 は OnProfileSwitched などの通知先メソッドを定義する。TrackerUpdateResult.cs:16,38-54 は EmittedEvents と
    TrackerEvent を別に定義する。変更前の履歴も domain event、observer 契約を別々に挙げていた。
  required_action: 「イベントと通知先の契約」とし、必要な箇所で ITrackerObserver と TrackerEvent を明記する。イベントの発行順序と通知先への配送順序も混同しない。
- id: WR-004
  severity: medium
  origin: introduced_by_change
  location: README.md:56,58-75; Tracker/Tracker.DebugHost/README.md:73-78,420-424; tools/lint/markdown-whitelist.yaml:187-190
  title: profile switch / profile を設定組へ置き換えず、設定プロファイルで統一する
  description: 実際の HEAD の表記は主に「設定組」「設定組の切り替え」「設定組切り替え」であり、利用者が例示した「設定組入れ替え」という完全一致文字列ではない。profile switch と runtime profile
    は許可済みだが本文から説明名が消えている。
  impact: Profiles、ActiveProfileName、Profile Control と本文の対応を追いにくくし、許可後も不自然な造語を強いる状態になっている。
  evidence: ホワイトリスト:187-190、DebugHost README:75 の Profile Control、:281 の ActiveProfileName、:285 の Profiles と本文を照合した。
  required_action: 利用者指定の「設定プロファイル」を意味付きで登録し、名詞は設定プロファイル、操作は設定プロファイルの切り替えに統一する。profile switch を併記する場合は既存許可を利用する。設定キー、型名、画面の実名は変えない。
- id: WR-005
  severity: medium
  origin: introduced_by_change
  location: Tracker/Design/DebugHost/raw-vision-viewer-plan.md:278,292,316; tools/lint/markdown-whitelist.yaml:50-52,747-748
  title: 競技場をフィールドへ揃え、許可一覧も本文と整合させる
  description: 通常の field 表示が多数の箇所で「競技場」「競技場描画」に変わっている。現在の許可一覧にある片仮名表記は「競技フィールド」で、単独の「フィールド」は登録されていない。
  impact: フィールド表示という対象を大がかりな競技施設のように表し、利用者が指定した表記にも合わない。単に本文だけを戻すと現行の許可一覧に合わない。
  evidence: 変更された非 report Markdown 19文書の文字列集計で、競技場は base の1出現から HEAD の288出現になり、ホワイトリスト説明にも17出現ある。集計は出現数であり、不具合件数ではない。
  required_action: 利用者指定どおり競技領域・描画領域の意味で「フィールド」を許可し、その意味の「競技場」を変更する。データ構造の field はデータ項目として分ける。Field source など実際の画面名や許可済み名称は保持する。
- id: WR-006
  severity: medium
  origin: pre_existing
  location: Tracker/Design/Core/tracker-architecture-plan.md:123,125,526; Tracker/Design/DebugHost/debug-host-cli-ui-detail-design.md:12,26,32,42;
    tools/lint/markdown-whitelist.yaml:113-116
  title: キャプチャーの追加承認を反映し、傍受や受信記録への過剰な言い換えを整理する
  description: 「傍受」は変更前にも存在しており、この PR がキャプチャーを傍受へ新しく訳したとは言えない。一方、許可済み packet capture は「受信記録本体」などへ変わり、キャプチャーは未登録である。今回は利用者が明示的に追加を承認した。
  impact: 通信内容を取得・保存する操作と、単なる受信ログが同じ呼称になり、保存対象や操作が読み取りにくい。
  evidence: architecture-plan.md:526 は受信した TrackerWrapperPacket を記録用フォルダの JSONL に保存する説明。変更前後とも傍受と書いている。cli-ui-detail-design.md:42
    は packet capture 本体から受信記録本体へ変更。
  required_action: 「キャプチャー」を通信内容の取得・保存の意味で追加し、該当する傍受・packet capture の説明へ使う。受信そのものや診断ログまで一律にキャプチャーへ変えない。キャプチャという別表記の追加は自動的な承認とみなさない。
- id: WR-007
  severity: medium
  origin: introduced_by_change
