    Tracker/Design/DebugHost/debug-host-maintainability-design.md:14
  title: 許可済み語を許可後も別の説明へ置き換えており、名称と本文が一致していない
  description: 代表例は Kalman filter → カルマン状態推定、process noise → プロセス側の揺らぎ、measurement noise → 観測側の揺らぎ、timeline scrubber → 再生位置操作部、render
    snapshot → 描画時点の記録。許可済みの名称を避ける必要はない。
  impact: 推定方式、設定項目、記録形式や画面部品の名前をコード・許可一覧と結び付けにくくする。状態推定のような広い言葉では、方式名という識別情報も弱くなる。
  evidence: whitelist:467-476 は Kalman filter / process noise / measurement noise をソース識別子付きで許可。:173-174 は timeline scrubber、:353-357
    は render snapshot を許可。before/after の全登録語の出現行は同梱の audit JSON に記録。
  required_action: 変更前に現れる許可済み英語・片仮名語を audit JSON から追い、同じ意味なら許可済みの標準表記・別表記を残す。まず上記5種と profile、raw vision、source frame number、Field
    source、replay timeline、diagnostics sample tick を本文に対応付ける。日本語の説明は名称を消す代替ではなく補足として添える。自然な日本語まで機械的に不具合とは数えず、未対応の語は個別に採否と根拠を記録する。
