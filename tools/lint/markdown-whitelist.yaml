version: "0.2"
entries:
  - term: CandidateMissing
    aliases:
      - candidate-missing
      - Candidate Missing
    description: 表示元の候補が無い状態名。表示全体は消さず、準備済み部分と欠落理由を残す。
  - term: NoCandidateSnapshot
    aliases:
      - no-candidate-snapshot
      - No Candidate Snapshot
    description: 比較候補の記録が無い状態名。後続の記録を代用しないことを示す。
  - term: ReplayTimelineIndex
    aliases:
      - replay timeline tick
      - selected replay timeline tick
      - selected-replay-timeline-tick
    description: 診断再生位置を識別する値。保存済み対応表と結び付けて比較位置を特定する。
  - term: same-source
    aliases:
      - same source
      - same-source 1 layer
    description: 左右の表示元が同じ状態名。重複描画を避けるため単一表示へまとめる。
  - term: saved-session-alignment
    aliases:
      - saved session alignment
      - saved alignment record
    description: 保存済み記録と外部追跡記録の対応表。同じ再生位置で比較するために使う。
  - term: source
    aliases:
      - source selection
      - source selector
      - source filter
    description: 表示元を選ぶ設計語。既存本文との互換用で、一般説明語としては追加しない。
  - term: Tracked
    description: 自前追跡結果を表示用形式へ変換した表示名。未加工入力とは分けて扱う。
  - term: Tracker.DebugHost
    aliases:
      - tracker-debug-host
      - tracker debug host
      - Tracker DebugHost
    description: 診断と比較表示を担当する実行体名。
  - term: Tracker.RuntimeHost
    aliases:
      - Tracker RuntimeHost
      - tracker-runtime-host
      - tracker runtime host
    description: 通常運用と自動判定を同じ処理内で動かす実行体名。
  - term: WorldFrameCommitted
    aliases:
      - world frame
      - world-frame
    description: 追跡結果の確定時点を表す通知名。未加工入力の保存周期とは分けて扱う。
  - term: SSL-Vision
    aliases:
      - SSL Vision
    description: 競技映像入力の名称。
  - term: ASP.NET Core
    aliases:
      - ASP NET Core
      - ASPNETCORE
    description: 実行基盤の製品名。
  - term: .NET SDK
    aliases:
      - NET SDK
      - .NET
    description: 開発環境の名称。
  - term: Tracker.CaptureReplay
    aliases:
      - Tracker CaptureReplay
    description: 記録再生用の実行体名。
  - term: Tracker.Server
    aliases:
      - Tracker Server
    description: 旧診断実行体名。
  - term: SSL_WrapperPacket
    aliases:
      - SSL WrapperPacket
    description: 未加工入力の型名。
  - term: TrackerCoordinator
    aliases:
      - Tracker Coordinator
    description: 追跡処理をまとめる型名。
  - term: 3rd party tracker
    aliases:
      - third-party tracker
      - third party tracker
      - 3rd-party tracker
    description: 外部追跡器を指す設計語。
  - term: ER-Force
    aliases:
      - ER-FORCE
      - ER Force
    description: 外部追跡器または模擬器の名称。
  - term: Vision Input
    aliases:
      - Vision input
      - vision input
    description: 診断画面で未加工の入力記録を選ぶ表示名。
  - term: Raw Aggregate
    aliases:
      - raw aggregate
      - raw-aggregate
    description: 複数撮影元をまとめた未加工入力の表示名。
  - term: Raw Camera
    aliases:
      - raw camera
      - raw-camera
    description: 撮影元ごとの未加工入力の表示名。
  - term: Layer A/B
    aliases:
      - Layer A
      - Layer B
      - layer A/B
    description: 比較表示で左右の対象を示す表示名。
  - term: Fast Forward
    aliases:
      - FastForward
      - fast forward
    description: 再生速度を上げる操作名。
  - term: Capture On
    aliases:
      - CaptureOn
      - Capture On
    description: 記録開始の操作名または状態名。
  - term: Capture Off
    aliases:
      - CaptureOff
      - Capture Off
    description: 記録停止の操作名または状態名。
  - term: latest-before snapshot
    aliases:
      - latest before snapshot
      - latest-before hold
    description: 選択時点以前の最新記録を使う設計語。
  - term: Tracker:ActiveProfileName
    aliases:
      - ActiveProfileName
    description: 有効な設定名を選ぶ設定キー。
  - term: Tracker:Profiles
    aliases:
      - Tracker Profiles
      - Tracker:Profiles:<name>
    description: 設定群を表す設定階層。
  - term: ReorderWindowNs
    aliases:
      - reorder-window
      - reorder window
    description: 並べ替え猶予を表す設定名。
  - term: AutoRef mode
    aliases:
      - AutoRef
      - autoref-mode
    description: 自動判定の実行形態を指す設計語。
  - term: raw vision viewer
    aliases:
      - raw-vision-viewer
      - raw vision
    description: 未加工入力を確認する画面の設計語。
  - term: Vision split / overlay
    aliases:
      - Vision split
      - Vision overlay
      - split / overlay
      - split mode
      - overlay mode
    description: 比較画面の表示方式をまとめた設計語。
  - term: overlay layer contract
    aliases:
      - overlay layer
      - layer contract
    description: 重ね描画時の契約名。
  - term: geometry contract
    aliases:
      - geometry-reference
      - geometry reference
    description: 競技場描画の基準を表す契約名。
  - term: same render tick
    aliases:
      - same-render-tick
      - UI render tick
      - ui-render-tick
    description: 同一描画時点で比較する契約名。
  - term: render snapshot
    aliases:
      - render-snapshot
      - render snapshots
    description: 旧診断表示の記録を指す設計語。
  - term: tracker source snapshot
    aliases:
      - tracker-source snapshot
      - tracker snapshot
      - tracker-snapshot
    description: 追跡器由来の記録を指す設計語。
  - term: latest-before fallback
    aliases:
      - latest before fallback
      - diagnostics latest-before fallback contract
    description: 後続記録を代用しないための設計契約名。
  - term: トラッカー
    description: 追跡器の一般表記。
  - term: カルマン
    description: 推定方式の一般表記。
