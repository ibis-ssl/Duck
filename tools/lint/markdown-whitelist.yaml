version: "0.2"
entries:
  - term: SudachiPy
    description: 日本語を形態素に分けるために使う解析器名。
  - term: Python
    description: 語彙抽出と形態素検査を実行する処理系名。
  - term: JavaScript
    description: 従来の許可一覧検査で使っている処理系名。
  - term: Markdown
    description: 文書構造と記法を持つ軽量記述形式名。
  - term: リンク
    description: 文書内から別の場所や参照先を指す記法名。
  - term: CandidateMissing
    aliases:
      - candidate-missing
      - Candidate Missing
    description: 表示元の候補が無い状態名。表示全体は消さず、準備済み部分と欠落理由を残す。
  - term: NoCandidateSnapshot
    aliases:
      - no-candidate-snapshot
      - No Candidate Snapshot
    description: 比較候補の記録が無い状態名。後続の記録を代用しないことを示す。
  - term: ReplayTimelineIndex
    description: 診断再生位置を識別する値。保存済み対応表と結び付けて比較位置を特定する。
  - term: replay timeline tick
    description: 診断再生の時系列に含まれる 1 件の時点。
  - term: selected replay timeline tick
    aliases:
      - selected-replay-timeline-tick
    description: 診断画面で現在選ばれている再生時点。
  - term: same-source
    aliases:
      - same source
    description: 左右の表示元が同じ状態名。重複描画を避けるため単一表示へまとめる。
  - term: saved-session-alignment
    aliases:
      - saved session alignment
    description: 保存済み記録と外部追跡記録の対応表。同じ再生位置で比較するために使う。
  - term: alignment record
    aliases:
      - alignment-record
    description: 保存済み対応表に含まれる 1 件の対応記録。
  - term: Tracked
    description: 画面で追跡済み状態を選ぶ表示名。未加工入力とは分けて扱う。
  - term: Field source
    description: 診断画面の競技場表示で、左右どちらに描く情報を選ぶ項目名。
  - term: Field source selector
    description: 診断画面で競技場表示の表示元を選ぶ画面部品名。
  - term: source key
    aliases:
      - source-key
    description: 表示元を内部で取り違えないための識別値。
  - term: source label
    description: 画面に出す表示元名。内部識別値とは分けて扱う。
  - term: source role
    description: 表示元を自前追跡、外部追跡、不明などに分ける分類名。
  - term: source identity
    description: 受信した追跡出力の表示元を判別するための情報。
  - term: source metadata
    description: 表示元の判別や比較に使う付随情報。
  - term: source option
    aliases:
      - source options
    description: 画面で選べる表示元候補。
  - term: source selector
    description: 表示元を選ぶ画面部品。
  - term: source snapshot
    description: 特定の表示元から得た時点記録。
  - term: source cadence
    description: 表示元ごとの到着間隔。
  - term: source sample
    description: 表示元から得た 1 回分の記録。
  - term: source detection
    aliases:
      - source detections
    description: 未加工入力に含まれる検出情報。
  - term: source name
    description: 受信内容や設定に含まれる表示元名。
  - term: source frame number
    description: SSL-Vision などの入力元が検出単位に付けた番号。追跡器が出す番号とは分けて扱う。
  - term: aggregate source
    description: 複数候補から代表値を選んで扱う表示元。
  - term: field geometry
    description: 競技場の線、得点枠、境界など、描画と座標比較の基準になる形状情報。
  - term: raw geometry
    description: 未加工入力から得た競技場形状情報。
  - term: render snapshot geometry
    description: render snapshot に含まれる競技場形状情報。
  - term: field rendering part
    aliases:
      - field-rendering-part
    description: 競技場背景、境界線、球、機体を描く画面部品の責務境界。
  - term: split field component
    aliases:
      - split-field-component
    description: 左右分割表示で競技場を描く画面部品。
  - term: overlay field component
    aliases:
      - overlay-field-component
    description: 重ね表示で複数の対象を同じ競技場上に描く画面部品。
  - term: layer group
    aliases:
      - layer-group
    description: 重ね表示で Layer A/B の描画要素をまとめる単位。
  - term: viewport state
    aliases:
      - viewport-state
    description: 競技場表示の拡大率、表示位置、移動状態を保持する表示状態。
  - term: packet capture
    description: 受信した通信内容を後から再生や調査に使えるように保存した記録。
  - term: capture metadata
    description: 記録時の設定、関連保存物、時刻対応などを再生時に復元するための付随情報。
  - term: session folder
    description: 1 回の記録に属する記録、補助保存物、付随情報をまとめて置く保存先。
  - term: packet snapshot
    description: 受信または生成した追跡器の通信単位を比較用に固定した記録。
  - term: tracker packet snapshot
    description: トラッカー通信単位を比較用に固定した記録。
  - term: snapshot log
    description: スナップショットを後から参照できるよう保存した記録。
  - term: TrackedFrame snapshot
    description: 追跡結果の内容を比較用に固定した記録。
  - term: snapshot sidecar
    description: 主記録とは別に保存する、時点記録用の補助保存物。
  - term: sidecar JSONL
    description: 補助保存物を 1 行 1 件の JSONL 形式で保存する設計語。
  - term: alignment sidecar
    aliases:
      - tracker snapshot alignment sidecar
    description: 診断項目、描画時点記録、トラッカー時点記録の対応関係を保存する補助保存物。
  - term: alignment log
    description: 保存済み対応関係を後から参照できるよう保存した記録。
  - term: alignment status
    description: 保存済み対応関係の有無や読み取り状態を表す状態。
  - term: diagnostics sample sidecar
    aliases:
      - diagnostics-sample-sidecar
    description: 診断再生で同じ保存単位の未加工入力と追跡出力を復元するための補助保存物。
  - term: official tracker packet
    description: 公式追跡出力の形式で送受信するトラッカー通信単位。
  - term: official tracker proto
    description: 公式追跡出力の通信形式。
  - term: official proto
    description: 公式形式として扱う通信形式。
  - term: tracker proto
    description: トラッカー出力の通信形式。
  - term: comparison panel
    description: 診断画面で複数の表示元を比較する表示領域。
  - term: primary ball
    description: 複数の球の中で主対象として扱う球。
  - term: secondary ball
    description: 主対象ではないが追跡結果として残す補助対象の球。
  - term: kicked ball
    description: 蹴られた状態として扱う球。
  - term: ball left field
    description: 球が競技場外へ出た状態を表す判定語。
  - term: camera-local track
    description: 撮影元単位で保持する局所的な追跡状態。
  - term: camera-local ball track
    description: 撮影元単位で保持する球の追跡状態。
  - term: camera-local robot track
    description: 撮影元単位で保持する機体の追跡状態。
  - term: event time
    description: 到着順ではなく、観測や検出の時刻として扱う基準時刻。
  - term: replay timeline
    description: 診断再生で選択や移動に使う時系列。
  - term: timeline scrubber
    description: 再生位置を手動で移動する画面部品。
  - term: playback tick
    description: 再生処理が表示位置を進める 1 回分の更新単位。
  - term: diagnostics log
    description: 診断情報を後から確認するために保存した記録。
  - term: diagnostics replay
    description: 保存済み診断情報を後から再生する機能。
  - term: diagnostics playback
    description: 診断画面上で再生操作により時系列を進める機能。
  - term: diagnostics sample tick
    aliases:
      - diagnostics-sample-tick
    description: 診断再生で未加工入力と追跡出力を同じ保存単位として固定する時点。
  - term: profile switch
    description: 実行中に有効な設定組を切り替える操作または処理。
  - term: runtime profile
    description: 実行時に使われる設定組と、その切替状態を表す設計語。
  - term: partial class
    description: C# の 1 つの型定義を複数のソースコードに分ける構成。
  - term: type-owned folder
    description: 型名の保存場所を作り、その中に責務別のソースコードを置く構成。
  - term: XML documentation comment
    description: C# の公開 API などに付ける説明文形式。
  - term: exit code
    description: 命令終了時に成功や失敗の種類を示す数値。
  - term: error message
    description: 失敗時に利用者へ表示する内容。
  - term: Tracker.DebugHost
    aliases:
      - tracker-debug-host
      - tracker debug host
      - Tracker DebugHost
    description: 診断と比較表示を担当する実行体名。
  - term: Tracker.RuntimeHost
    aliases:
      - Tracker RuntimeHost
      - tracker-runtime-host
      - tracker runtime host
    description: 通常運用と自動判定を同じ処理内で動かす実行体名。
  - term: WorldFrameCommitted
    description: 追跡結果の確定時点を表す通知名。未加工入力の保存周期とは分けて扱う。
  - term: world frame
