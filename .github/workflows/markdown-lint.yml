name: Markdown lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Markdown lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run Markdown lint
        id: markdown_lint
        run: node tools/lint/scripts/run-markdown-lint-ci.js

      - name: Collect Markdown lint diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          $results = Join-Path $env:GITHUB_WORKSPACE "artifacts/markdown-lint"
          New-Item -ItemType Directory -Force -Path $results | Out-Null

          @"
          repository=$env:GITHUB_REPOSITORY
          sha=$env:GITHUB_SHA
          ref=$env:GITHUB_REF
          run_id=$env:GITHUB_RUN_ID
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          runner_os=$env:RUNNER_OS
          "@ | Set-Content -Encoding utf8 (Join-Path $results "environment.txt")

          "## node --version" | Add-Content (Join-Path $results "environment.txt")
          node --version 2>&1 | Add-Content (Join-Path $results "environment.txt")
          "## npm --version" | Add-Content (Join-Path $results "environment.txt")
          npm --version 2>&1 | Add-Content (Join-Path $results "environment.txt")
          "## python --version" | Add-Content (Join-Path $results "environment.txt")
          python --version 2>&1 | Add-Content (Join-Path $results "environment.txt")
          "## git status --short" | Add-Content (Join-Path $results "environment.txt")
          git status --short 2>&1 | Add-Content (Join-Path $results "environment.txt")
          "## git diff --check" | Add-Content (Join-Path $results "environment.txt")
          git diff --check 2>&1 | Add-Content (Join-Path $results "environment.txt")
          "## npm ls --depth=0" | Add-Content (Join-Path $results "environment.txt")
          npm ls --depth=0 2>&1 | Add-Content (Join-Path $results "environment.txt")
          "## pip freeze" | Add-Content (Join-Path $results "environment.txt")
          if (Test-Path ".venv/Scripts/python.exe") {
            .venv/Scripts/python.exe -m pip freeze 2>&1 | Add-Content (Join-Path $results "environment.txt")
          } elseif (Test-Path ".venv/bin/python") {
            .venv/bin/python -m pip freeze 2>&1 | Add-Content (Join-Path $results "environment.txt")
          }

      - name: Upload Markdown lint artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: markdown-lint-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/markdown-lint
          if-no-files-found: error
          retention-days: 14
