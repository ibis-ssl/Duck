name: .NET tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Commit pending fixture correction
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/dotnet-test-failure-artifacts' }}
        shell: bash
        run: |
          set -euo pipefail

          path="Tracker/Tracker.Tests/TrackerDiagnosticsComparisonViewStateTests.cs"
          old='var receivedAt = new DateTimeOffset(2026, 5, 13, 9, 45, 0, TimeSpan.Zero);'
          new='var receivedAt = new DateTimeOffset(2026, 5, 12, 12, 0, 0, TimeSpan.Zero);'

          python3 - "$path" "$old" "$new" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          old = sys.argv[2]
          new = sys.argv[3]
          text = path.read_text(encoding="utf-8")
          count = text.count(old)
          if count == 0:
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f"expected one fixture timestamp, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          if git diff --quiet -- "$path"; then
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "test: align future snapshot fixture timestamps"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Run dotnet test
        id: dotnet_test
        shell: bash
        run: |
          set +e

          results_dir="$GITHUB_WORKSPACE/artifacts/test-results"
          mkdir -p "$results_dir"

          dotnet test Tracker/Tracker.Tests/Tracker.Tests.csproj \
            --logger "trx;LogFileName=dotnet-test.trx" \
            --results-directory "$results_dir" \
            --diag "$results_dir/vstest-diagnostics.log" \
            --blame \
            -m:1 \
            /nr:false \
            -bl:"$results_dir/dotnet-test.binlog" \
            > >(tee "$results_dir/dotnet-test.stdout.log") \
            2> >(tee "$results_dir/dotnet-test.stderr.log" >&2)

          test_exit_code=$?
          printf '%s\n' "$test_exit_code" > "$results_dir/dotnet-test.exit-code"
          exit "$test_exit_code"

      - name: Collect failure diagnostics
        if: ${{ always() && steps.dotnet_test.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail

          results_dir="$GITHUB_WORKSPACE/artifacts/test-results"
          mkdir -p "$results_dir"

          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'sha=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'test_exit_code=%s\n' "$(cat "$results_dir/dotnet-test.exit-code" 2>/dev/null || printf unknown)"
            printf '\n## dotnet --info\n'
            dotnet --info
            printf '\n## git status --short\n'
            git status --short
            printf '\n## git submodule status --recursive\n'
            git submodule status --recursive
          } > "$results_dir/environment.txt" 2>&1

          git ls-files --recurse-submodules -z \
            | tar --null --verbatim-files-from --files-from=- \
                -czf "$results_dir/source.tar.gz"

      - name: Upload test failure artifact
        if: ${{ always() && steps.dotnet_test.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 14
